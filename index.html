<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guardianes de los Cuadros Mágicos</title><style>
:root{color-scheme:dark;--bg:#080d20;--panel:#121d3b;--line:#31476d;--gold:#ffcf59;--cyan:#68e8f0;--pink:#ff6fbc;--good:#79f5a8;--bad:#ff848d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#223c72 0,transparent 36%),radial-gradient(circle at 96% 12%,#57296a 0,transparent 34%),var(--bg);color:#f6f7ff;font:16px system-ui,'Segoe UI',sans-serif;min-height:100vh}.wrap{max-width:1060px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.brand{font-weight:1000;font-size:clamp(22px,4vw,35px);letter-spacing:.5px}.brand b{color:var(--gold)}.sub{color:#bbcaea;font-size:13px}.stats{display:flex;gap:9px;flex-wrap:wrap}.chip{background:#0e1832;border:1px solid #3b5683;padding:9px 13px;border-radius:14px;font-weight:700}.chip span{color:var(--gold)}main{margin-top:22px}.card{border:1px solid #385487;background:linear-gradient(155deg,#192b51,#0e1730);box-shadow:0 16px 40px #0006;border-radius:23px;padding:clamp(17px,4vw,30px)}h1{font-size:clamp(25px,5vw,46px);margin:8px 0}h2{margin:5px 0 12px;font-size:clamp(21px,3vw,29px)}p{line-height:1.55}.muted{color:#bdcbea}.kicker{color:var(--cyan);text-transform:uppercase;font-size:12px;letter-spacing:2px;font-weight:900}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:15px;align-items:center}.art{text-align:center;font-size:110px;filter:drop-shadow(0 0 24px #fce27e55)}button,input,textarea{font:inherit}button{border:0;cursor:pointer;font-weight:850;border-radius:12px;padding:12px 17px;background:linear-gradient(120deg,#ffdc72,#ffad57);color:#17203c;transition:transform .12s,filter .12s}button:hover{filter:brightness(1.08)}button:active{transform:scale(.97)}button.secondary{background:#263960;color:white;border:1px solid #5777a6}button.ghost{background:transparent;border:1px solid #6279a6;color:#e0eaff}button:disabled{cursor:not-allowed;opacity:.5}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}input,textarea{background:#0a1430;color:#fff;border:1px solid #5873a0;padding:13px;border-radius:12px;width:100%;outline:none}input:focus,textarea:focus{border-color:var(--cyan)}label{display:block;font-weight:700;margin-bottom:7px}.q{font-size:clamp(26px,5vw,40px);font-weight:900;text-align:center;padding:19px 6px;color:var(--gold)}.answer{display:flex;gap:10px;max-width:430px;margin:0 auto}.answer input{text-align:center;font-size:24px}.feedback{margin-top:15px;background:#101d3b;border-left:4px solid var(--cyan);padding:13px;border-radius:8px;line-height:1.5;white-space:pre-wrap}.progress{height:11px;background:#0b1328;border-radius:40px;overflow:hidden;margin:12px 0 24px}.progress div{background:linear-gradient(90deg,#54dfe9,#ed80e7);height:100%;transition:width .3s}.small{font-size:13px}.magic-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,.8fr);gap:24px;align-items:start}.board{display:grid;gap:7px;max-width:500px;margin:auto}.cell{aspect-ratio:1;border-radius:12px;border:2px solid #48649c;background:#18294d;color:#f5faff;font-size:clamp(17px,3.5vw,27px);font-weight:950;padding:0;position:relative}.cell.fixed{background:#33476e;border-color:#3d557f;color:#cad6ed;cursor:default}.cell.empty{border:2px dashed #58adc0;background:#12293e;color:var(--cyan)}.cell.filled{background:#224f66;border-color:#6eeacf}.cell.selected{outline:3px solid var(--gold);outline-offset:1px}.pool{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:10px 0}.tile{min-width:47px;min-height:45px;padding:9px;background:#324b84;color:white;border:1px solid #7591c9;font-size:18px}.tile.selected{background:var(--gold);color:#162044}.sums{font-size:14px;color:#d4dffa;text-align:center;margin-top:9px}.instructions{padding:12px 15px;border-radius:12px;background:#132545;border:1px solid #344d7a}.rank{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.rank>div{padding:15px;border:1px solid #45608e;border-radius:13px;text-align:center;background:#111f3f}.rank strong{display:block;font-size:28px;color:var(--gold)}.toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:min(560px,90vw);background:#253d70;border:1px solid #89aad7;border-radius:14px;padding:14px;text-align:center;z-index:9;box-shadow:0 8px 20px #0009}.hidden{display:none}.foot{text-align:center;color:#90a6cc;font-size:12px;margin:25px 0}.status{display:inline-block;border-radius:16px;padding:7px 12px;background:#26486c;color:#aaf2fd;font-weight:800}.rules{margin:13px 0;padding-left:21px;line-height:1.75}.confetti{animation:pop .7s ease alternate infinite}@keyframes pop{from{transform:rotate(-3deg) scale(.96)}to{transform:rotate(3deg) scale(1.04)}}@media(max-width:760px){.hero,.magic-wrap{grid-template-columns:1fr}.art{font-size:64px}.board{max-width:420px}.wrap{padding:10px}.card{padding:15px}.tile{min-width:40px}.rank{gap:5px}.rank strong{font-size:22px}}
</style></head><body><div class="wrap"><header><div><div class="brand">⚡ <b>GUARDIANES</b> DE LOS CUADROS MÁGICOS</div><div class="sub">Matemáticas I · Escuela Webster · Profesor Roberto Rico · 11 de noviembre de 2026</div></div><div class="stats"><div class="chip">⭐ <span id="points">0</span> pts</div><div class="chip">⏳ <span id="clock">50:00</span></div><div class="chip">🏛️ <span id="level">1/3</span></div></div></header><main id="app"></main><div class="foot">Juego educativo sin conexión · No envía datos personales · Al terminar, entrega una captura en Classroom</div></div><div id="toast" class="toast hidden" role="alert"></div><script>
'use strict';
const $=s=>document.querySelector(s),app=$('#app');let stage=0,phase='home',points=0,seconds=3000,timer=null,student='',questions=[],qi=0,tries=0,board=[],solution=[],fixed=[],selectedTile=null,puzzleHints=0,blocked=false,completeLevels=0,finished=false;
const stages=[{n:3,name:'Templo del Sol',target:15,icon:'☀️',blank:4,difficulty:'INICIACIÓN'},{n:4,name:'Fortaleza de los Cuatro Vientos',target:34,icon:'🌪️',blank:8,difficulty:'INTERMEDIO'},{n:5,name:'Santuario del Infinito',target:65,icon:'🌌',blank:12,difficulty:'AVANZADO'}];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){let t=$('#toast');t.innerHTML=m;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),3300)}
function sync(){ $('#points').textContent=points;$('#level').textContent=(stage+1)+'/3';$('#clock').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(seconds<=300)$('#clock').style.color='#ff8f9b'}
function start(){student=$('#student').value.trim()||'Explorador/a';seconds=3000;timer=setInterval(()=>{if(seconds>0){seconds--;sync()}else{clearInterval(timer);if(!finished){toast('⌛ ¡Terminó el tiempo! Revisa tus logros.');endGame(true)}}},1000);stage=0;points=0;completeLevels=0;nextLevel()}
function home(){phase='home';app.innerHTML=`<div class="card hero"><div><div class="kicker">MISIÓN DE 50 MINUTOS</div><h1>¡Tres templos. Tres poderes. Un solo guardián! 🔮</h1><p>Resuelve <b>operaciones aritméticas</b> para desbloquear cuadros mágicos de <b>9, 16 y 25 casillas</b>. ¡La matemática es la llave!</p><label for="student">Tu nombre o nombre de equipo</label><input id="student" maxlength="45" placeholder="Escribe tu nombre"><div class="buttons"><button onclick="start()">🚀 Comenzar misión</button></div></div><div class="art">🧙‍♂️<br>🔢</div></div><div class="card" style="margin-top:15px"><h2>🎮 Reglas de la aventura</h2><ul class="rules"><li>Cada templo exige <b>4 retos de jerarquía de operaciones</b> para abrir sus puertas.</li><li>En cada reto tienes <b>2 intentos</b>. Si ambos fallan, verás la solución razonada y avanzarás <b>sin puntos</b>.</li><li>Completa los cuadros con números <b>sin repetir</b>, de forma que filas, columnas y diagonales principales sumen lo mismo.</li><li>Puedes usar pistas que revelan casillas, pero reducen tus puntos potenciales.</li><li>Al salir de la pestaña durante el reto suena una alerta (si el navegador lo permite); el tiempo sigue corriendo.</li></ul><p class="small muted">Nota: el profesor podrá verificar los resultados mediante una captura de pantalla al finalizar. Este archivo no envía mensajes ni registra el cambio de pestaña en un servidor.</p></div>`}
function makeQ(level){let a=rand(2,14),b=rand(2,12),c=rand(2,9),d=rand(2,8),x,answer,steps;const kind=rand(0,4);if(kind===0){x=`${a} + ${b} × ${c}`;answer=a+b*c;steps=`Primero multiplicamos: ${b} × ${c} = ${b*c}.\nDespués sumamos: ${a} + ${b*c} = ${answer}.`}else if(kind===1){x=`(${a} + ${b}) × ${c}`;answer=(a+b)*c;steps=`Primero el paréntesis: ${a} + ${b} = ${a+b}.\nLuego multiplicamos: ${a+b} × ${c} = ${answer}.`}else if(kind===2){let k=rand(2,9),z=rand(2,7);x=`${a} + ${k*z} ÷ ${k} × ${c}`;answer=a+z*c;steps=`División y multiplicación se resuelven de izquierda a derecha:\n${k*z} ÷ ${k} = ${z}; ${z} × ${c} = ${z*c}.\nFinalmente: ${a} + ${z*c} = ${answer}.`}else if(kind===3){let v=rand(2,8);x=`${a} × (${b} − ${v}) + ${c}`;answer=a*(b-v)+c;steps=`Primero paréntesis: ${b} − ${v} = ${b-v}.\nDespués producto: ${a} × (${b-v}) = ${a*(b-v)}.\nFinalmente sumamos ${c}: ${answer}.`}else{let k=rand(2,7),v=rand(2,6);x=`${k*(b+v)} ÷ (${b} + ${v}) + ${a} × ${c}`;answer=k+a*c;steps=`Primero paréntesis: ${b} + ${v} = ${b+v}.\nDespués división: ${k*(b+v)} ÷ ${b+v} = ${k}.\nMultiplicación: ${a} × ${c} = ${a*c}.\nSuma final: ${k} + ${a*c} = ${answer}.`;}return {x,answer,steps}}
function nextLevel(){phase='quiz';qi=0;tries=0;blocked=false;questions=Array.from({length:4},()=>makeQ(stage));quiz()}
function quiz(msg=''){phase='quiz';blocked=false;let s=stages[stage],q=questions[qi];app.innerHTML=`<div class="card"><div class="kicker">${s.difficulty} · ${s.icon} ${s.name}</div><h2>🔐 Descifra el código ${qi+1} de 4</h2><div class="progress"><div style="width:${qi/4*100}%"></div></div><p class="muted">Orden: <b>paréntesis → multiplicaciones y divisiones de izquierda a derecha → sumas y restas de izquierda a derecha</b>.</p><div class="q">${q.x} = ?</div><div class="answer"><input type="number" step="any" inputmode="decimal" id="ans" placeholder="Resultado" aria-label="Respuesta"><button onclick="checkAnswer()">Comprobar</button></div><p class="small muted" style="text-align:center">Intento ${tries+1} de 2 · Acierto: +100 puntos</p>${msg?`<div class="feedback">${msg}</div>`:''}<div class="buttons"><button class="ghost" onclick="showTip()">💡 Pista de jerarquía</button></div></div>`;$('#ans').focus();$('#ans').onkeydown=e=>{if(e.key==='Enter')checkAnswer()}}
function showTip(){toast('💡 Resuelve primero lo que está entre paréntesis. Después × y ÷, en orden de aparición; al final + y −.')}
function checkAnswer(){if(blocked)return;let val=$('#ans').value.replace(',','.');if(val.trim()===''){toast('Escribe un resultado antes de comprobar.');return}let q=questions[qi],num=Number(val);if(Math.abs(num-q.answer)<1e-9){blocked=true;points+=100;sync();app.querySelector('.answer').innerHTML='<span class="status">✅ ¡Código correcto! +100 puntos</span>';showResolution('¡Excelente! La puerta reconoce tu respuesta.\n'+q.steps,true)}else{tries++;if(tries<2){quiz('⚠️ Aún no. Revisa la prioridad: ¿hiciste la multiplicación antes que la suma?')}else{blocked=true;app.querySelector('.answer').innerHTML='<span class="status">📖 Aprendizaje desbloqueado · 0 puntos</span>';showResolution(`La respuesta correcta es ${q.answer}.\n${q.steps}`,false)}}}
function showResolution(txt,correct){let el=document.createElement('div');el.className='feedback';el.textContent=txt;app.querySelector('.card').appendChild(el);let b=document.createElement('button');b.textContent=qi===3?'🗝️ Entrar al cuadro mágico':'➡️ Siguiente código';b.onclick=()=>{qi++;tries=0;if(qi===4)initPuzzle();else quiz()};app.querySelector('.card').appendChild(b)}
function genMagic(n){let m=Array.from({length:n},()=>Array(n).fill(0));if(n%2===1){let r=0,c=Math.floor(n/2);for(let k=1;k<=n*n;k++){m[r][c]=k;let nr=(r-1+n)%n,nc=(c+1)%n;if(m[nr][nc])r=(r+1)%n;else {r=nr;c=nc}}}else if(n%4===0){for(let r=0;r<n;r++)for(let c=0;c<n;c++){let k=r*n+c+1;m[r][c]=(r%4===c%4||(r%4+c%4===3))?k:n*n+1-k}}else throw Error('Orden no soportado');let rot=rand(0,3);for(let k=0;k<rot;k++)m=m[0].map((_,c)=>m.map(row=>row[c]).reverse());if(rand(0,1))m=m.map(row=>row.slice().reverse());return m.flat()}
function initPuzzle(){phase='puzzle';let s=stages[stage];solution=genMagic(s.n);let indices=shuffle(Array.from({length:s.n*s.n},(_,i)=>i));fixed=Array(s.n*s.n).fill(true);indices.slice(0,s.blank).forEach(i=>fixed[i]=false);board=solution.map((v,i)=>fixed[i]?v:null);selectedTile=null;puzzleHints=0;renderPuzzle()}
function pool(){let nums=solution.filter((_,i)=>!fixed[i]);let placed=board.filter((v,i)=>!fixed[i]&&v!==null);for(let v of placed){let i=nums.indexOf(v);if(i>=0)nums.splice(i,1)}return nums.sort((a,b)=>a-b)}
function renderPuzzle(msg=''){phase='puzzle';let s=stages[stage],n=s.n,unused=pool(),cells=board.map((v,i)=>`<button aria-label="Casilla ${i+1} ${v??'vacía'}" class="cell ${fixed[i]?'fixed':v==null?'empty':'filled'}" ${fixed[i]?'disabled':''} onclick="setCell(${i})">${v??'?'}</button>`).join('');app.innerHTML=`<div class="card"><div class="kicker">${s.icon} ${s.name} · ${s.difficulty}</div><h2>🧩 Cuadro mágico de ${n} × ${n}</h2><div class="progress"><div style="width:100%"></div></div><p class="instructions">🪄 Cada fila, columna y las <b>dos diagonales principales</b> deben sumar <b style="color:var(--gold);font-size:22px">${s.target}</b>. Usa los números del 1 al ${n*n} sin repetir. Las casillas grises son fijas. <b>1)</b> Toca un número disponible; <b>2)</b> toca una casilla con «?» para colocarlo.</p><div class="magic-wrap"><div><div class="board" style="grid-template-columns:repeat(${n},1fr)">${cells}</div><div class="sums">✨ Constante mágica: ${s.target} · ${s.blank} casillas inicialmente vacías</div></div><div><h2 style="font-size:20px">🔢 Números disponibles</h2><div class="pool">${unused.length?unused.map(v=>`<button class="tile ${selectedTile===v?'selected':''}" onclick="pick(${v})">${v}</button>`).join(''):'<p>¡Todos los números colocados!</p>'}</div><div class="buttons"><button class="secondary" onclick="removeLast()">↩️ Quitar una ficha</button><button class="secondary" onclick="hintCell()">💡 Revelar casilla (−60 pts)</button><button onclick="verify()">✅ Comprobar cuadro</button></div><p class="muted small">Pistas usadas: ${puzzleHints}. Si una posición no funciona, puedes tocarla para retirar su número. Al verificar, recibirás una pista sobre los renglones que no cumplen la suma.</p></div></div>${msg?`<div class="feedback">${esc(msg)}</div>`:''}</div>`}
function pick(v){selectedTile=v;renderPuzzle();toast('🔢 Número '+v+' seleccionado. Ahora toca una casilla libre.')}
function setCell(i){if(fixed[i])return;if(board[i]!==null){selectedTile=board[i];board[i]=null;renderPuzzle();return}if(selectedTile===null){toast('Primero toca un número disponible.');return}if(board.includes(selectedTile)){toast('Ese número ya está colocado.');return}board[i]=selectedTile;selectedTile=null;renderPuzzle()}
function removeLast(){let i=board.findLastIndex((v,j)=>!fixed[j]&&v!==null);if(i<0){toast('No hay fichas para quitar');return}board[i]=null;renderPuzzle('Ficha retirada. Puedes probar otra ubicación.')}
function hintCell(){let candidates=board.map((v,i)=>!fixed[i]&&v!==solution[i]?i:-1).filter(i=>i>=0);if(!candidates.length){toast('No necesitas más pistas.');return}let i=candidates[rand(0,candidates.length-1)];if(board.includes(solution[i])){let j=board.findIndex((v,k)=>!fixed[k]&&v===solution[i]);if(j>=0)board[j]=null;}board[i]=solution[i];fixed[i]=true;puzzleHints++;points=Math.max(0,points-60);sync();renderPuzzle('✨ Se reveló una casilla correcta. Busca patrones en filas, columnas y diagonales.')}
function verify(){let s=stages[stage],n=s.n;if(board.some(v=>v===null)){renderPuzzle('⏳ Todavía faltan casillas. Completa los espacios marcados con «?».');return}if(new Set(board).size!==n*n){renderPuzzle('⚠️ Hay números repetidos. Cada uno debe aparecer una sola vez.');return}let wrong=[];for(let r=0;r<n;r++){let sum=board.slice(r*n,(r+1)*n).reduce((a,b)=>a+b,0);if(sum!==s.target)wrong.push('Fila '+(r+1)+': '+sum)}for(let c=0;c<n;c++){let sum=0;for(let r=0;r<n;r++)sum+=board[r*n+c];if(sum!==s.target)wrong.push('Columna '+(c+1)+': '+sum)}let d1=0,d2=0;for(let i=0;i<n;i++){d1+=board[i*n+i];d2+=board[i*n+n-i-1]}if(d1!==s.target)wrong.push('Diagonal ↘: '+d1);if(d2!==s.target)wrong.push('Diagonal ↙: '+d2);if(wrong.length){renderPuzzle('🔎 ¡A investigar! Estas sumas aún no son mágicas:\n'+wrong.slice(0,6).join(' · ')+'\nBusca qué fichas puedes intercambiar.');return}points+=[300,500,800][stage];sync();completeLevels++;phase='cleared';app.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:80px" class="confetti">🏆</div><div class="kicker">TEMPLO CONQUISTADO</div><h1>¡Cuadro mágico de ${n}×${n} completado!</h1><p>Comprobaste todas las filas, columnas y las dos diagonales. Cada una suma <b>${s.target}</b>.</p><p class="status">+${[300,500,800][stage]} puntos por descifrarlo</p><div class="buttons" style="justify-content:center"><button onclick="advance()">${stage===2?'🏅 Ver diploma final':'➡️ Abrir siguiente templo'}</button></div></div>`}
function advance(){if(stage<2){stage++;nextLevel();sync()}else endGame(false)}
function endGame(expired){if(finished)return;finished=true;clearInterval(timer);phase='end';let max=2800;let rank=points>=2000?'GUARDIÁN LEGENDARIO 🥇':points>=1100?'MAESTRO DE LOS NÚMEROS 🥈':'EXPLORADOR MATEMÁTICO 🥉';app.innerHTML=`<div class="card" id="diploma"><div class="kicker">MISIÓN FINALIZADA · ESCUELA WEBSTER</div><h1>🎉 ${expired?'¡Tiempo cumplido!':'¡Felicidades, guardián!'}</h1><p>Nombre: <b>${esc(student)}</b></p><h2>${rank}</h2><div class="rank"><div>⭐ Puntos<strong>${points}</strong></div><div>🏛️ Templos<strong>${completeLevels}/3</strong></div><div>⏱️ Tiempo restante<strong>${Math.floor(seconds/60)} min</strong></div></div><p>Recuerda: para resolver una expresión respetamos los signos de agrupación, después multiplicaciones y divisiones de izquierda a derecha y, al final, sumas y restas de izquierda a derecha.</p><label for="reflection">✍️ Con tus palabras: ¿qué aprendiste sobre la jerarquía de operaciones y los cuadros mágicos?</label><textarea id="reflection" rows="4" placeholder="Hoy aprendí que..."></textarea><div class="buttons"><button onclick="downloadDiploma()">💾 Guardar evidencia (TXT)</button><button class="secondary" onclick="window.print()">🖨️ Imprimir / Guardar en PDF</button><button class="ghost" onclick="location.reload()">🔁 Jugar de nuevo</button></div><p class="small muted">📸 Toma una captura que incluya tu nombre, puntuación y explicación, y entrégala en Google Classroom. La explicación no se envía automáticamente.</p></div>`}
function downloadDiploma(){let s=`GUARDIANES DE LOS CUADROS MÁGICOS\nEscuela Webster | Matemáticas I\nEstudiante: ${student}\nPuntos: ${points}\nTemplos: ${completeLevels}/3\nReflexión: ${$('#reflection').value}`;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/plain;charset=utf-8'}));a.download='evidencia_cuadros_magicos.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
let audioCtx=null;function beep(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();for(let i=0;i<3;i++){let o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+i*.23;o.type='square';o.frequency.value=650+i*100;g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.17)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase!=='home'&&phase!=='end'){beep();}else if(!document.hidden&&phase!=='home'&&phase!=='end'){toast('🚨 Saliste de la misión. El reloj continuó avanzando. ¡Regresa a los retos!')}});
window.addEventListener('beforeprint',()=>{if(phase!=='end')toast('Para imprimir tu diploma primero completa o finaliza la misión.')});home();sync();
</script></body></html>
